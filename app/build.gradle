plugins { id 'com.android.application' }
android {
    namespace 'com.example.myapp'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.myapp'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    androidResources {
        noCompress 'html'
    }
    def ks = file('anshify.p12')
    if (ks.exists()) {
        signingConfigs { anshify { storeFile ks; storeType 'pkcs12'; storePassword 'anshify123'; keyAlias 'anshify'; keyPassword 'anshify123' } }
        buildTypes {
            debug { signingConfig signingConfigs.anshify }
            release { signingConfig signingConfigs.anshify }
        }
    }
    if (!ks.exists()) {
        buildTypes { release { signingConfig signingConfigs.debug } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
